---

container_conf_dir: "{{ container_prefix }}/etc/"

image_name: "docker.io/balabit/syslog-ng:latest"
service_name: "syslog-collector"

# Rendered configs; a change restarts the service (generic post)
container_restart_watch:
  # Spelled out: in the generic post, container_conf_dir resolves to the generic
  # role's default (data/), not this role's etc/.
  - "{{ container_prefix }}/etc/syslog-ng.conf"
