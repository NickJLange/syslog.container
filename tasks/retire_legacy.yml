---
# The pre-Quadlet role ran syslog-collector as a system unit
# (/etc/systemd/system/syslog-collector.service, User=container_user) around a
# `podman run` container of the same name. Left in place it keeps ports
# 1514/1601 and the container name, so the Quadlet unit cannot start.
- name: Check for the legacy system unit syslog-collector.service
  stat:
    path: /etc/systemd/system/{{ container_friendly_name }}.service
  register: syslog_legacy_system_unit
  become: yes
  become_user: root

- block:
  - name: Stop and disable the legacy system unit
    systemd:
      name: "{{ container_friendly_name }}.service"
      state: stopped
      enabled: no
      scope: system

  - name: Remove the legacy system unit file
    file:
      path: "{{ syslog_legacy_system_unit.stat.path }}"
      state: absent

  - name: Reload systemd and forget the legacy unit
    shell: "systemctl daemon-reload && (systemctl reset-failed {{ container_friendly_name }}.service || true)"

  - name: Remove the legacy podman-run container
    shell: "{{ podman_path }} rm --force --ignore {{ container_friendly_name }}"
    args:
      chdir: /
    become_user: "{{ container_user }}"
  become: yes
  become_user: root
  when: syslog_legacy_system_unit.stat.exists
